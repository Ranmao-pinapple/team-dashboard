<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>臻畅/泰瑞 · 月拉动计划看板（按天）</title>
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --card-hover: #1c2330;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --yellow: #d29922;
    --red: #f85149;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    padding: 40px 20px;
    min-height: 100vh;
  }
  .container { max-width: 1300px; margin: 0 auto; }
  h1 { font-size: 26px; margin-bottom: 6px; }
  .subtitle { color: var(--muted); margin-bottom: 20px; font-size: 14px; }
  .badge {
    display: inline-block;
    padding: 3px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    margin-left: 10px;
    vertical-align: middle;
  }
  .badge-live { background: rgba(63,185,80,.15); color: var(--green); border: 1px solid var(--green); }
  .nav { margin-bottom: 16px; }
  .nav a {
    color: var(--accent); text-decoration: none; font-size: 13px;
    margin-right: 16px; opacity: .8;
  }
  .nav a:hover { opacity: 1; }
  .toolbar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 14px; flex-wrap: wrap; gap: 10px;
  }
  .legend { font-size: 12px; color: var(--muted); }
  .legend span { margin-right: 12px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
  .updated { color: var(--muted); font-size: 12px; }
  .month-picker { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .month-picker button {
    padding: 6px 14px;
    background: var(--card); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    font-size: 13px; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .month-picker button:hover { border-color: var(--accent); }
  .month-picker button.active { background: var(--accent); color: #0d1117; font-weight: 700; border-color: var(--accent); }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    overflow-x: auto;
  }
  table { width: 100%; border-collapse: collapse; min-width: 1150px; }
  th {
    text-align: center; color: var(--muted); font-size: 11px; font-weight: 600;
    padding: 6px 3px; border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  th:first-child, td:first-child { text-align: left; }
  th.today { color: var(--yellow); }
  th.weekend { color: #3d444d; }
  th.group-end { border-right: 1px solid #3d444d; }
  td { padding: 4px 3px; font-size: 12px; border-bottom: 1px solid var(--border); text-align: center; white-space: nowrap; }
  td.today { background: rgba(210,153,34,.12); box-shadow: inset 0 0 0 1px var(--yellow); border-radius: 4px; }
  td.weekend { color: #3d444d; }
  td.group-end { border-right: 1px solid #3d444d; }
  tr:hover td { background: rgba(88,166,255,.04); }
  .part { font-weight: 600; font-size: 13px; }
  .proj { color: var(--muted); font-size: 11px; }
  .total-row td { border-top: 2px solid var(--border); font-weight: 700; color: var(--accent); }
  .cell-pair { line-height: 1.25; }
  .cell-pair .plan { color: var(--green); font-weight: 600; font-size: 12px; }
  .cell-pair .act { color: var(--accent); font-size: 11px; }
  .cell-pair .act.miss { color: var(--red); }
  .cell-pair .act.hit { color: var(--green); }
  .cell-plan-only { color: var(--yellow); font-weight: 600; font-size: 12px; }
  .cell-zero { color: #3d444d; }
  .rate { font-size: 12px; font-weight: 700; }
  .rate-high { color: var(--green); }
  .rate-mid { color: var(--yellow); }
  .rate-low { color: var(--red); }
  .status { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; }
  .st-live { background: rgba(63,185,80,.15); color: var(--green); }
  .st-plan { background: rgba(88,166,255,.15); color: var(--accent); }
  .st-wait { background: rgba(210,153,34,.15); color: var(--yellow); }
  .empty-note { color: var(--muted); font-size: 13px; padding: 20px; text-align: center; }
  .footer { color: var(--muted); font-size: 12px; margin-top: 24px; text-align: center; }

  /* ===== 密码锁 ===== */
  #lockScreen {
    position: fixed; inset: 0; z-index: 9999;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(4px);
  }
  .lock-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px;
    width: 340px;
    text-align: center;
  }
  .lock-box .lock-icon { font-size: 48px; margin-bottom: 12px; }
  .lock-box h2 { font-size: 20px; margin-bottom: 6px; }
  .lock-box p { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  .lock-box input {
    width: 100%; padding: 12px 16px;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    font-size: 15px; outline: none; margin-bottom: 12px;
    box-sizing: border-box;
  }
  .lock-box input:focus { border-color: var(--accent); }
  .lock-box button {
    width: 100%; padding: 12px;
    background: var(--accent); color: #0d1117;
    border: none; border-radius: 8px;
    font-size: 15px; font-weight: 700; cursor: pointer;
    transition: opacity .15s;
  }
  .lock-box button:hover { opacity: .85; }
  .lock-err { color: var(--red); font-size: 13px; min-height: 18px; margin-bottom: 8px; }
</style>
</head>
<body>

<div id="lockScreen">
  <div class="lock-box">
    <div class="lock-icon">🔒</div>
    <h2>团队看板 · 访问受限</h2>
    <p>请输入访问密码</p>
    <input type="password" id="lockPass" placeholder="访问密码" onkeydown="if(event.key==='Enter')tryUnlock()">
    <div class="lock-err" id="lockErr"></div>
    <button onclick="tryUnlock()">进入看板</button>
  </div>
</div>

<div class="container" style="display:none" id="mainContent">
  <h1>📅 臻畅/泰瑞 · 月拉动计划看板 <span class="badge badge-live">● LIVE</span></h1>
  <div class="nav"><a href="./">← 返回项目看板</a></div>
  <p class="subtitle">精确到天的拉动计划 vs 实际发货 · 数据由白猫定期从订单信息自动更新</p>

  <div class="toolbar">
    <div class="legend">
      <span><span class="dot" style="background:var(--green)"></span>计划</span>
      <span><span class="dot" style="background:var(--accent)"></span>实际</span>
      <span><span class="dot" style="background:var(--red)"></span>实际未达标</span>
      <span><span class="dot" style="background:var(--yellow)"></span>■ 今天</span>
      <span><span class="dot" style="background:#3d444d"></span>周末/无计划</span>
    </div>
    <div class="updated" id="updatedLabel">最后更新：--</div>
  </div>

  <div class="month-picker" id="monthPicker"></div>

  <div class="card" id="tableWrap"></div>

  <div class="footer">
    由 白猫 (Hermes Agent) 自动更新 · 数据源：订单/社交软件跟进
  </div>
</div>

<script>
// ===== 月拉动计划数据块（白猫脚本自动更新区域） =====
// daily  = 计划数量（当月1号~31号，每个自然日一个数）
// actual = 实际发货数量（没有的月份/日期不填或为0）
const PULL_DATA = {
  updatedAt: "2026-07-31",
  year: 2026,
  rows: [
    {
      part: "VFe32 小海绵",
      proj: "凯华",
      status: "live",
      daily: {
        7: [0, 0, 0, 0, 400, 0, 0, 400, 400, 400, 0, 0, 400, 400, 400, 0, 0, 400, 400, 400, 0, 0, 400, 400, 400, 0, 0, 400, 400, 400, 0],
        8: [0, 0, 0, 0, 400, 0, 0, 400, 400, 400, 0, 0, 400, 400, 400, 0, 0, 400, 400, 400, 0, 0, 400, 400, 400, 0, 0, 400, 400, 400, 0]
      },
      actual: {
        7: [0, 0, 0, 0, 400, 0, 0, 400, 380, 400, 0, 0, 360, 400, 400, 0, 0, 400, 400, 400, 0, 0, 400, 400, 400, 0, 0, 400, 400, 400, 0]
      }
    },
    {
      part: "Limo Green 吸音棉",
      proj: "Limo Green",
      status: "wait",
      daily: {
        8: [0, 0, 0, 0, 250, 0, 0, 250, 250, 250, 0, 0, 250, 250, 250, 0, 0, 250, 250, 250, 0, 0, 250, 250, 250, 0, 0, 250, 250, 250, 0]
      },
      actual: {}
    },
    {
      part: "Limo Green 海绵",
      proj: "Limo Green",
      status: "wait",
      daily: {
        8: [0, 0, 0, 0, 150, 0, 0, 150, 150, 150, 0, 0, 150, 150, 150, 0, 0, 150, 150, 150, 0, 0, 150, 150, 150, 0, 0, 150, 150, 150, 0]
      },
      actual: {}
    },
    {
      part: "示例：新项目A",
      proj: "待定",
      status: "plan",
      daily: {},
      actual: {}
    }
  ]
};

// ===== 渲染逻辑 =====
const statusMap = {
  live: '<span class="status st-live">✅ 已确认</span>',
  plan: '<span class="status st-plan">🔵 预测</span>',
  wait: '<span class="status st-wait">🔄 待定</span>'
};

let currentMonth = new Date().getMonth() + 1;
const today = new Date();

function daysInMonth(year, month) {
  return new Date(year, month, 0).getDate();
}

function renderMonthPicker() {
  const wrap = document.getElementById('monthPicker');
  let html = '';
  for (let m = 1; m <= 12; m++) {
    const hasData = PULL_DATA.rows.some(r => r.daily[m]);
    html += `<button class="${m === currentMonth ? 'active' : ''}" onclick="selectMonth(${m})">${m}月${hasData ? ' ·' : ''}</button>`;
  }
  wrap.innerHTML = html;
}

function selectMonth(m) {
  currentMonth = m;
  document.querySelectorAll('#monthPicker button').forEach(b => {
    b.classList.toggle('active', parseInt(b.textContent) === m);
  });
  render();
}

function rateClass(rate) {
  if (rate >= 100) return 'rate-high';
  if (rate >= 90) return 'rate-mid';
  return 'rate-low';
}

function render() {
  const wrap = document.getElementById('tableWrap');
  const dim = daysInMonth(PULL_DATA.year, currentMonth);
  const hasAnyData = PULL_DATA.rows.some(r => r.daily[currentMonth]);

  if (!hasAnyData) {
    wrap.innerHTML = `<div class="empty-note">📭 ${currentMonth}月暂无按天拉动数据 —— 待白猫接入订单信息后自动填充</div>`;
    return;
  }

  const planTotals = new Array(dim).fill(0);
  const actTotals = new Array(dim).fill(0);
  let html = '<table><tr><th>零件</th><th>项目</th><th>状态</th><th>月计划</th><th>月实际</th><th>达成率</th>';
  for (let d = 1; d <= dim; d++) {
    const dt = new Date(PULL_DATA.year, currentMonth - 1, d);
    const isWeekend = dt.getDay() === 0 || dt.getDay() === 6;
    const isToday = dt.toDateString() === today.toDateString();
    html += `<th class="${isToday ? 'today' : isWeekend ? 'weekend' : ''}">${d}${isToday ? '★' : ''}</th>`;
  }
  html += '</tr>';

  PULL_DATA.rows.forEach(r => {
    const arr = r.daily[currentMonth];
    if (!arr) return;
    const act = r.actual[currentMonth] || [];
    let planSum = 0, actSum = 0;
    html += `<tr><td class="part">${r.part}</td><td class="proj">${r.proj}</td><td>${statusMap[r.status]}</td>`;
    // 月计划/月实际/达成率
    for (let d = 0; d < dim; d++) {
      planSum += arr[d] || 0;
      actSum += act[d] || 0;
    }
    const rate = planSum > 0 ? Math.round((actSum / planSum) * 100) : 0;
    html += `<td>${planSum.toLocaleString()}</td><td>${actSum > 0 ? actSum.toLocaleString() : '—'}</td><td class="rate ${rateClass(rate)}">${planSum > 0 && actSum > 0 ? rate + '%' : '—'}</td>`;

    for (let d = 0; d < dim; d++) {
      const plan = arr[d] || 0;
      const a = act[d] || 0;
      planTotals[d] += plan;
      actTotals[d] += a;
      const dt = new Date(PULL_DATA.year, currentMonth - 1, d + 1);
      const isWeekend = dt.getDay() === 0 || dt.getDay() === 6;
      const isToday = dt.toDateString() === today.toDateString();
      let cls = isToday ? 'today' : '';
      if (isWeekend && plan === 0) cls += ' weekend';

      if (plan > 0 && a > 0) {
        const miss = a < plan;
        cls += ' group-end';
        html += `<td class="${cls.trim()}"><div class="cell-pair"><div class="plan">${plan.toLocaleString()}</div><div class="act ${miss ? 'miss' : 'hit'}">${a.toLocaleString()}</div></div></td>`;
      } else if (plan > 0) {
        cls += ' group-end';
        html += `<td class="${cls.trim()}"><div class="cell-pair"><div class="plan">${plan.toLocaleString()}</div><div class="act" style="color:#3d444d">—</div></div></td>`;
      } else if (a > 0) {
        cls += ' group-end';
        html += `<td class="${cls.trim()}"><div class="cell-pair"><div class="plan" style="color:#3d444d">—</div><div class="act">${a.toLocaleString()}</div></div></td>`;
      } else {
        cls += ' group-end';
        html += `<td class="${cls.trim()}"><div class="cell-pair"><div class="plan cell-zero">—</div><div class="act cell-zero">—</div></div></td>`;
      }
    }
    html += '</tr>';
  });

  // 合计行
  let grandPlan = 0, grandAct = 0;
  html += '<tr class="total-row"><td colspan="3">当日合计</td><td id="totalPlanCell"></td><td id="totalActCell"></td><td id="totalRateCell"></td>';
  for (let d = 0; d < dim; d++) {
    grandPlan += planTotals[d];
    grandAct += actTotals[d];
    const dt = new Date(PULL_DATA.year, currentMonth - 1, d + 1);
    const isWeekend = dt.getDay() === 0 || dt.getDay() === 6;
    const isToday = dt.toDateString() === today.toDateString();
    let cls = isToday ? 'today' : '';
    if (isWeekend && planTotals[d] === 0) cls += ' weekend';
    if (planTotals[d] > 0 || actTotals[d] > 0) {
      const miss = actTotals[d] < planTotals[d];
      html += `<td class="${cls.trim()}"><div class="cell-pair"><div class="plan">${planTotals[d] > 0 ? planTotals[d].toLocaleString() : '—'}</div><div class="act ${miss ? 'miss' : 'hit'}">${actTotals[d] > 0 ? actTotals[d].toLocaleString() : '—'}</div></div></td>`;
    } else {
      html += `<td class="${cls.trim()}"><div class="cell-pair"><div class="plan cell-zero">—</div><div class="act cell-zero">—</div></div></td>`;
    }
  }
  html += '</tr>';

  wrap.innerHTML = html;

  // 填合计行的月度汇总
  document.getElementById('totalPlanCell').textContent = grandPlan.toLocaleString();
  document.getElementById('totalActCell').textContent = grandAct > 0 ? grandAct.toLocaleString() : '—';
  const totalRate = grandPlan > 0 ? Math.round((grandAct / grandPlan) * 100) : 0;
  document.getElementById('totalRateCell').innerHTML = `<span class="rate ${rateClass(totalRate)}">${grandPlan > 0 && grandAct > 0 ? totalRate + '%' : '—'}</span>`;

  document.getElementById('updatedLabel').textContent = `最后更新：${PULL_DATA.updatedAt} · ${PULL_DATA.year}年`;
}

// ===== 密码锁逻辑 =====
const PAGE_PASSWORD = "tairui999"; // ← 修改这里即可换密码
const lockScreen = document.getElementById('lockScreen');
const lockPass = document.getElementById('lockPass');
const lockErr = document.getElementById('lockErr');
const mainContent = document.getElementById('mainContent');

function tryUnlock() {
  if (lockPass.value === PAGE_PASSWORD) {
    lockScreen.style.display = 'none';
    mainContent.style.display = '';
    sessionStorage.setItem('dashboard_unlocked', '1');
    lockErr.textContent = '';
  } else {
    lockErr.textContent = '密码错误，请重试';
    lockPass.value = '';
    lockPass.focus();
  }
}

if (sessionStorage.getItem('dashboard_unlocked') === '1') {
  lockScreen.style.display = 'none';
  mainContent.style.display = '';
} else {
  lockPass.focus();
}

renderMonthPicker();
render();
</script>
</body>
</html>
