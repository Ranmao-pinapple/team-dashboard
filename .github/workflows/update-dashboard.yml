name: 看板数据自动同步
on:
  push:
    paths:
      - 'data/*.json'

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 生成数据块并更新页面
        run: python scripts/build_dashboard.py

      - name: 有变化则提交
        run: |
          git config user.name "白猫控制台[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "🤖 自动同步看板数据(由 data/*.json 触发)"
            git push
            echo "已提交并推送"
          fi
